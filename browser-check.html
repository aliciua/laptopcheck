  lidWake:"Выход из сна", lidWakeHint:"С разрешения продавца переведите ноутбук в режим сна, затем разбудите его. Экран и клавиатура снова работают?",
  caseCheck:"Состояние корпуса", caseCheckHint:"Посмотрите на корпус и разъёмы. Есть ли трещины, вмятины или разошедшиеся края? Разбирать ноутбук не нужно.",
  sellerTitle:"Что обещал продавец?", sellerHint:"Укажите характеристики из объявления или со слов продавца. Оставьте неизвестные поля пустыми.",
  compare:"Сравнить", match:"Совпадает", closeSize:"Близкий объём", mismatch:"Не совпадает", review:"Нужно уточнить", sellerValue:"Продавец", scannedValue:"Что показал ноутбук", noClaims:"Введите хотя бы одну характеристику для сравнения.",
  diskHours:"Часы работы диска с Windows", hours:"ч", hoursUnavailable:"Не удалось прочитать счётчик часов", installDate:"Дата установки Windows", oldestBoot:"Самый ранний запуск в журнале",
  hoursHint:"Это счётчик диска, на котором установлена Windows. Если диск заменили, часы старого диска не учитываются. Общее время работы ноутбука неизвестно.",
  historyTitle:"Сведения о диске и история Windows", historyHint:"Эти даты не подтверждают дату первого включения ноутбука."
});
const fullChecks = [...quickChecks,"pad","camera","mic","charge","battery","ports","wifi","hinges","caseCheck","bluetooth","externalDisplay","headphone","lidWake"];
const app = document.querySelector("#app");
const localChecker = document.documentElement.hasAttribute("data-local-checker") &&
  location.protocol === "http:" && ["localhost", "127.0.0.1"].includes(location.hostname);
const params = new URLSearchParams(location.search);
const browserQuick = !localChecker && params.get("quick") === "1";
const browserChecks = quickChecks.slice(1);
let lang = params.get("lang") === "ky" ? "ky" : "ru";
let mode = browserQuick ? "quick" : null;
let step = 0;
let results = {};
let report = null;
let seller = {claims:{}, compared:false};
let cleanup = () => {};
const t = key => copy[lang][key];
const checks = () => browserQuick ? browserChecks : mode === "full" ? fullChecks : quickChecks;
const landing = () => `./?lang=${lang}`;
const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
})[char]);

function button(id, label, primary = false) {
  return `<button type="button" id="${id}"${primary ? ' class="primary"' : ""}>${t(label)}</button>`;
}
function on(id, action) { document.getElementById(id).addEventListener("click", action); }
function start(selected) {
  mode = selected;
  step = 0;
  results = {};
  report = null;
  seller = {claims:{}, compared:false};
  render();
}
function render(focus = true) {
  cleanup();
  cleanup = () => {};
  document.documentElement.lang = lang;
  for (const code of ["ky","ru"]) document.getElementById(code).setAttribute("aria-pressed", String(code === lang));
  if (!mode) {
    app.innerHTML = `<section class="hero"><div><h1 tabindex="-1">${t("title")}</h1><p>${t("intro")}</p></div><div class="illustration" aria-hidden="true"><div class="screen"><div class="screen-mark">✓</div></div><div class="base"></div></div></section>
      <div class="cards">${["quick","full"].map(kind => `<section class="card"><h2>${t(kind)}</h2><p>${t(kind+"Desc")}</p>${button(kind+"Start",kind,kind==="quick")}</section>`).join("")}</div>`;
    on("quickStart", () => start("quick"));
    on("fullStart", () => start("full"));
  } else if (step >= checks().length) {
    renderSummary();
  } else {
    renderStep(checks()[step]);
  }
  if (focus) app.querySelector("h1").focus();
}
function renderStep(check) {
  app.innerHTML = `<section class="panel"><p class="progress">${t("step")} ${step+1} / ${checks().length}</p>
    <progress aria-label="${t("step")}" value="${step+1}" max="${checks().length}"></progress>
    <h1 tabindex="-1">${t(check)}</h1><p class="lead">${t(check === "specs" ? (localChecker ? "localSpecDesc" : "specDesc") : check+"Hint")}</p>
    <div class="stage" id="stage"></div><p class="status" id="status" role="status"></p>
    <div class="actions">${check === "specs" ? button("next","next",true) : button("good","good",true)+button("bad","bad")+button("skip","skip")}</div>
    <div class="actions nav">${button("back",step ? "back" : "home")}</div></section>`;
  on("back", () => {
    if (step) step--;
    else if (browserQuick) { location.href = landing(); return; }
    else mode = null;
    render();
  });
  if (check === "specs") on("next", () => { step++; render(); });
  else for (const result of ["good","bad","skip"]) {
    on(result, () => { results[check] = result; step++; render(); });
  }
  const stage = document.getElementById("stage");
  const status = message => { document.getElementById("status").textContent = message; };
  if (check === "specs") setupReport(stage,status);
  if (check === "display") setupDisplay(stage);
  if (check === "keyboard") setupKeyboard(stage,status);
  if (check === "sound" || check === "headphone") setupSound(stage,status);
  if (check === "pad") {
    stage.innerHTML = `<button id="tap" class="pad">${t("tap")}</button>`;
    on("tap", () => status(t("tapped")));
  }
  if (["camera","mic"].includes(check)) setupMedia(check,stage,status);
}
function reportHtml() {
  if (!report) return "";
  const {diskHours, installDate, oldestBoot, details, ...specs} = report;
  const row = ([key,value]) => {
    const display = value?.label ? t(value.label) : value;
    return `<dt>${t(key)}</dt><dd>${escapeHtml(display ?? t("unseen"))}</dd>`;
  };
  const specRows = `<dl class="report-grid">${Object.entries(specs).map(row).join("")}</dl>`;
  if (diskHours === undefined) return specRows;
  const formattedHours = diskHours === null ? t("hoursUnavailable") :
    `${new Intl.NumberFormat(lang).format(diskHours)} ${t("hours")}`;
  const extras = details ? `<details class="history-details"${mode === "full" ? " open" : ""}><summary>${t("detailTitle")}</summary>
    <dl class="report-grid">${Object.entries(details).map(row).join("")}</dl></details>` : "";
  return `${specRows}${extras}<details class="history-details"><summary>${t("historyTitle")}</summary>
    <dl class="report-grid">${row(["diskHours",formattedHours])}</dl><p class="lead">${t("hoursHint")}</p>
    <dl class="report-grid">${Object.entries({installDate,oldestBoot}).map(row).join("")}</dl><p class="lead">${t("historyHint")}</p></details>`;
}
function readReport(data, fromWindows = false) {
  const validNumber = value => Number.isFinite(value) && value > 0;
  const validText = value => typeof value === "string" && value.trim();
  if (data?.version !== 1) throw new Error("Unsupported report version");
  const ram = validNumber(data.ramGiB) ? data.ramGiB+" GB" : null;
  const cpu = validText(data.processor) ? data.processor.trim().slice(0,160) : null;
  const disk = validNumber(data.storageGB) ? data.storageGB+" GB" : null;
  if (fromWindows ? !(ram || cpu || disk) : !ram) throw new Error("Incomplete report");
  const fields = {};
  if (validText(data.model)) fields.model = data.model.trim().slice(0,160);
  fields.ram = ram;
  fields.cpu = cpu;
  fields[fromWindows && data.storageScope === "windowsDisk" ? "windowsStorage" : "storage"] = disk;
  if (fromWindows) {
    fields.graphics = validText(data.graphics) ? data.graphics.trim().slice(0,240) : null;
    fields.windowsEdition = validText(data.windowsEdition) ? data.windowsEdition.trim().slice(0,120) : null;
    if (validText(data.windowsBuild)) fields.windowsBuild = data.windowsBuild.trim().slice(0,24);
    const charge = data.batteryChargePercent;
    fields.batteryCharge = Number.isFinite(charge) && charge >= 0 && charge <= 100 ? charge+"%" : null;
    fields.batteryCapacity = validNumber(data.batteryCapacityPercent) ? data.batteryCapacityPercent+"%" : null;
    fields.diskHours = Number.isInteger(data.diskPowerOnHours) && data.diskPowerOnHours >= 0 ? data.diskPowerOnHours : null;
    fields.installDate = /^\d{4}-\d{2}-\d{2}$/.test(data.windowsInstallDate) ? data.windowsInstallDate : null;
    fields.oldestBoot = /^\d{4}-\d{2}-\d{2}$/.test(data.oldestRecordedBootDate) ? data.oldestRecordedBootDate : null;
    const counter = value => Number.isSafeInteger(value) && value >= 0 ? value : null;
    const withUnit = (value, unit) => Number.isFinite(value) && value >= 0 ? value+" "+unit : null;
    fields.details = {
      cpuCores: validNumber(data.cpuCores) ? data.cpuCores : null,
      cpuThreads: validNumber(data.cpuThreads) ? data.cpuThreads : null,
      ramSpeed: Array.isArray(data.ramSpeeds) && data.ramSpeeds.some(validNumber) ?
        data.ramSpeeds.filter(validNumber).join(" / ")+" MHz" : null,
      displayMode: Array.isArray(data.displayModes) && data.displayModes.some(validText) ?
        data.displayModes.filter(validText).join(" / ").slice(0,160) : null,
      driveModel: validText(data.diskModel) ? data.diskModel.trim().slice(0,160) : null,
      driveBus: validText(data.diskBusType) ? data.diskBusType.trim().slice(0,32) : null,
      freeSpace: withUnit(data.systemVolumeFreeGB,"GB"),
      batteryCycles: counter(data.batteryCycles),
      batteryDesign: withUnit(data.batteryDesignMWh,"mWh"),
      batteryFull: withUnit(data.batteryFullMWh,"mWh"),
      diskTemp: Number.isFinite(data.diskTemperatureC) ? data.diskTemperatureC+" °C" : null,
      diskCycles: counter(data.diskPowerCycles),
      diskWear: withUnit(data.diskEnduranceUsedPercent,"%"),
      diskErrors: counter(data.diskMediaErrors),
      diskWarning: typeof data.diskCriticalWarning === "boolean" ? {label:data.diskCriticalWarning ? "diskWarningYes" : "diskWarningNo"} : null
    };
  }
  return fields;
}
function setupReport(stage,status) {
  if (localChecker) {
    stage.innerHTML = `<div id="imported">${reportHtml()}</div>${button("retryScan","retryScan")}`;
    let controller;
    cleanup = () => controller?.abort();
    async function scan() {
      controller = new AbortController();
      const retry = stage.querySelector("#retryScan");
      retry.disabled = true;
      status(t("scanning"));
      try {
        const response = await fetch("/api/specs", {signal: controller.signal});
        if (!response.ok) throw new Error("Scan failed");
        const data = await response.json();
        if (!stage.isConnected) return;
        report = readReport(data, true);
        stage.querySelector("#imported").innerHTML = reportHtml();
        status(t("scanned"));
      } catch {
        if (stage.isConnected) status(t("scanFailed"));
      } finally {
        if (stage.isConnected) retry.disabled = false;
      }
    }
    on("retryScan", scan);
    if (!report) scan();
    return;
  }
  stage.innerHTML = `<label for="file"><strong>${t("open")}</strong></label><div class="spec"><input id="file" type="file" accept=".json,application/json"></div><div id="imported">${reportHtml()}</div>`;
  const fileInput = document.getElementById("file");
  fileInput.addEventListener("change", async () => {
    const file = fileInput.files[0];
    if (!file) return;
    try {
      if (file.size > 64000) throw new Error();
      const data = JSON.parse(await file.text());
      if (!stage.isConnected || fileInput.files[0] !== file) return;
      report = readReport(data);
      stage.querySelector("#imported").innerHTML = reportHtml();
      status(t("loaded"));
    } catch {
      if (!stage.isConnected || fileInput.files[0] !== file) return;
      report = null;
      stage.querySelector("#imported").replaceChildren();
      status(t("invalid"));
    }
  });
}
function setupDisplay(stage) {
  const colors = ["#ffffff","#111111","#ee1717","#0bbd53","#204efa"];
  let index = 0;
  stage.innerHTML = `<button id="swatch" class="swatch" aria-label="${t("color")}"></button><div class="actions">${button("color","color")}${button("expand","expand")}</div>`;
  const swatch = document.getElementById("swatch");
  function paint() { swatch.style.backgroundColor = colors[index]; }
  function advance() { index = (index+1) % (mode === "quick" ? 2 : colors.length); paint(); }
  paint();
  on("color",advance);
  on("swatch",advance);
  if (swatch.requestFullscreen) on("expand", () => swatch.requestFullscreen().catch(() => {}));
  else document.getElementById("expand").hidden = true;
}
function setupKeyboard(stage,status) {
  const keys = mode === "quick" ? ["Q","A","Z","J","P","Space","Enter"] : [..."QWERTYUIOPASDFGHJKLZXCVBNM1234567890","Space","Enter","Backspace","ArrowUp","ArrowLeft","ArrowDown","ArrowRight"];
  const names = {Space:"␣",ArrowUp:"↑",ArrowLeft:"←",ArrowDown:"↓",ArrowRight:"→"};
  stage.innerHTML = `<div tabindex="0" aria-label="${t("keyArea")}" class="key-grid">${keys.map(key => `<span class="key" data-key="${key}">${names[key] || key}</span>`).join("")}</div>`;
  const hit = new Set();
  stage.firstElementChild.addEventListener("keydown", event => {
    const key = event.code.replace(/^(Key|Digit)/,"");
    if (!keys.includes(key)) return;
    event.preventDefault();
    hit.add(key);
    stage.querySelector(`[data-key="${key}"]`).classList.add("hit");
    status(`${t("seen")}: ${hit.size} / ${keys.length}`);
  });
}
function setupSound(stage,status) {
  stage.innerHTML = button("play","play");
  let context;
  cleanup = () => { if (context && context.state !== "closed") context.close().catch(() => {}); };
  on("play", async () => {
    try {
      context ||= new AudioContext();
      await context.resume();
      if (!stage.isConnected) return;
      const tone = context.createOscillator();
      const volume = context.createGain();
      tone.frequency.value = 440;
      volume.gain.value = 0.12;
      volume.gain.exponentialRampToValueAtTime(0.001,context.currentTime+0.55);
      tone.connect(volume).connect(context.destination);
      tone.start();
      tone.stop(context.currentTime+0.6);
    } catch { if (stage.isConnected) status(t("blocked")); }
  });
}
function setupMedia(check,stage,status) {
  stage.innerHTML = button("enable","enable");
  let stream, context, animation;
  cleanup = () => {
    stream?.getTracks().forEach(track => track.stop());
    if (context) context.close().catch(() => {});
    cancelAnimationFrame(animation);
  };
  on("enable", async () => {
    const enable = document.getElementById("enable");
    enable.disabled = true;
    status(t("waiting"));
    try {
      stream = await navigator.mediaDevices.getUserMedia(check === "camera" ? {video:true} : {audio:true});
      if (!stage.isConnected) { stream.getTracks().forEach(track => track.stop()); return; }
      status("");
      if (check === "camera") {
        const video = document.createElement("video");
        video.className = "preview";
        video.autoplay = video.playsInline = video.muted = true;
        video.srcObject = stream;
        stage.replaceChildren(video);
      } else {
        context = new AudioContext();
        await context.resume();
        if (!stage.isConnected) return;
        const analyser = context.createAnalyser();
        context.createMediaStreamSource(stream).connect(analyser);
        const samples = new Uint8Array(analyser.fftSize);
        const meter = document.createElement("meter");
        meter.max = 1;
        meter.setAttribute("aria-label",t("mic"));
        stage.replaceChildren(meter);
        let heard = false;
        function update() {
          analyser.getByteTimeDomainData(samples);
          const peak = samples.reduce((max, sample) => Math.max(max, Math.abs(sample-128)),0);
          meter.value = peak/128;
          if (peak > 8 && !heard) { heard = true; status(t("detected")); }
          animation = requestAnimationFrame(update);
        }
        update();
      }
    } catch {
      stream?.getTracks().forEach(track => track.stop());
      if (stage.isConnected) { enable.disabled = false; status(t("blocked")); }
    }
  });
}
const claimFields = {
  ramGB: ["ram","ram",true],
  storageGB: ["storage","windowsStorage",true],
  processor: ["cpu","cpu",false],
  graphics: ["graphics","graphics",false],
  model: ["model","model",false]
};

function compareClaim(key, claimed, observed) {
  if (!observed) return "review";
  if (key === "ramGB") return Number(claimed) === parseFloat(observed) ? "match" : "mismatch";
  if (key === "storageGB") {
    // Advertised drive capacity is nominal and can differ slightly from Windows.
    const difference = Math.abs(Number(claimed)-parseFloat(observed));
    if (difference < 0.5) return "match";
    return difference / Number(claimed) <= 0.05 ? "closeSize" : "mismatch";
  }
  const normalize = value => value.toLowerCase().replace(/[^\p{L}\p{N}]+/gu," ").trim();
  const expected = normalize(claimed);
  const actual = normalize(observed);
  if (expected && ` ${actual} `.includes(` ${expected} `)) return "match";
  if (key === "processor") {
    const intelModel = value => value.match(/\bi[3579] \d{4,5}[a-z]*\b/)?.[0];
    const fullExpected = intelModel(expected);
    const fullActual = intelModel(actual);
    if (fullExpected && fullActual && fullExpected !== fullActual) return "mismatch";
    const intelTier = value => value.match(/\bi[3579]\b/)?.[0];
    const expectedTier = intelTier(expected);
    const actualTier = intelTier(actual);
    if (expectedTier && actualTier && expectedTier !== actualTier) return "mismatch";
  }
  // A shorthand model name or an incomplete driver name needs a human check.
  return "review";
}

function setupSellerComparison() {
  const form = document.getElementById("seller-form");
  const comparison = document.getElementById("comparison");
  function showComparison() {
    const rows = Object.entries(claimFields).flatMap(([key,[label,field,numeric]]) => {
      const claimed = seller.claims[key];
      if (!claimed || (numeric && (!Number.isFinite(Number(claimed)) || Number(claimed) <= 0))) return [];
      const observed = report?.[field] ?? (key === "storageGB" ? report?.storage : null);
      const result = compareClaim(key,claimed,observed);
      const tone = result === "match" ? "good" : result === "mismatch" ? "bad" : "";
      return `<div class="result" data-result="${tone}"><div>${t(label)}<small>${t("sellerValue")} — ${escapeHtml(claimed)}${numeric ? " GB" : ""}</small><small>${t("scannedValue")} — ${escapeHtml(observed ?? t("unseen"))}</small></div><strong>${t(result)}</strong></div>`;
    });
    comparison.innerHTML = rows.length ? rows.join("") : `<p>${t("noClaims")}</p>`;
  }
  if (seller.compared) showComparison();
  form.addEventListener("input", event => {
    if (!Object.hasOwn(claimFields,event.target.name)) return;
    seller.claims[event.target.name] = event.target.value.trim();
    seller.compared = false;
    comparison.replaceChildren();
  });
  form.addEventListener("submit", event => {
    event.preventDefault();
    seller.compared = true;
    showComparison();
  });
}

function inspectionResults(keys) {
  return keys.map(key => {
    const result = results[key] || "unseen";
    return `<div class="result"><span>${t(key)}</span><strong data-result="${result}">${t(result)}</strong></div>`;
  }).join("");
}

function renderSummary() {
  if (browserQuick) {
    app.innerHTML = `<section class="panel"><h1 tabindex="-1">${t("browserSummary")}</h1>
      ${inspectionResults(browserChecks)}
      <p class="lead">${t("browserLimits")}</p>
      <div class="actions"><a class="download-link" href="${landing()}#download">${t("downloadChecker")}</a>${button("restart","restart")}</div></section>`;
    on("restart", () => start("quick"));
    return;
  }
  app.innerHTML = `<section class="panel"><h1 tabindex="-1">${t("summary")}</h1><p class="lead">${t("summaryHint")}</p>
    <section class="stage seller-panel" aria-labelledby="seller-title">
    <h2 id="seller-title">${t("sellerTitle")}</h2><p>${t("sellerHint")}</p>
    <form id="seller-form"><div class="claim-fields">${Object.entries(claimFields).map(([key,[label,,numeric]]) =>
      `<div><label for="claim-${key}">${t(label)}${numeric ? " (GB)" : ""}</label><input id="claim-${key}" name="${key}" ${numeric ? 'type="number" min="0.01" step="any" inputmode="decimal"' : 'maxlength="160"'} value="${escapeHtml(seller.claims[key] ?? "")}"></div>`
    ).join("")}</div><div class="actions"><button class="primary" type="submit">${t("compare")}</button></div></form>
    <div class="comparison" id="comparison" aria-live="polite"></div></section>
    <h2>${t("specs")}</h2>${report ? reportHtml() : `<p>${t("unseen")}</p>`}
    ${inspectionResults(checks().slice(1))}
    <div class="actions">${mode === "quick" ? button("extra","extra",true) : ""}${button("print","print")}${button("restart","restart")}</div></section>`;
  if (mode === "quick") on("extra", () => { mode = "full"; step = quickChecks.length; render(); });
  setupSellerComparison();
  on("print", () => window.print());
  on("restart", () => { mode = null; results = {}; report = null; render(); });
}
for (const code of ["ky","ru"]) on(code, () => { if (lang !== code) { lang = code; render(false); } });
render(false);
</script>
