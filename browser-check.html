<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaptopCheck</title>
<style>
  :root {
    color-scheme: light;
    --olive: #70702e;
    --rose: #d3a6a3;
    --sand: #c7beb3;
    --paper: #faf7ee;
    --ink: #2a2b1b;
    --muted: #5c594b;
    --rule: #d9d0be;
    --serif: Georgia, Cambria, serif;
    --input-edge: #918467;
    --olive-ink: #575821;
    --rose-ink: #653735;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    background: radial-gradient(ellipse at 95% 15%, #e9cfc766, transparent 42rem), var(--paper);
    font: 16px/1.55 system-ui, sans-serif;
  }
  ::selection { background: #edcfc9; color: var(--ink); }
  a { color: inherit; }
  button, input { font: inherit; }
  button { cursor: pointer; }
  summary { cursor: pointer; }
  a:focus-visible, button:focus-visible, input:focus-visible,
  summary:focus-visible, [tabindex]:focus-visible { outline: 3px solid #9a514f; outline-offset: 4px; }
  button, .download-link {
    min-height: 48px;
    padding: .58rem .92rem;
    border: 1px solid var(--input-edge);
    border-radius: .5rem;
    background: #fffdf7;
    color: var(--ink);
    font-weight: 650;
  }
  button:hover, .download-link:hover { background: #f0ded4; }
  button:disabled { color: var(--muted); background: #eee8dc; cursor: default; }
  .primary { background: var(--olive); color: white; border-color: var(--olive); }
  .primary:hover { background: #55571e; }
  #bad[aria-expanded="true"] { background: #efdbd2; color: var(--rose-ink); }
  .download-link { display: inline-flex; align-items: center; text-decoration: none; }
  .top { border-bottom: 1px solid var(--rule); }
  .wrap { width: min(74rem, calc(100% - 3rem)); margin-inline: auto; }
  .top .wrap { min-height: 4.4rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .brand { display: inline-flex; gap: .65rem; align-items: center; font-family: var(--serif); font-size: 1.35rem; font-weight: 700; letter-spacing: -.045em; }
  .brand-mark { width: 1.7rem; height: 1.55rem; color: var(--olive); }
  .languages { display: flex; gap: .22rem; padding: .2rem; border: 1px solid var(--rule); border-radius: 2rem; }
  .languages button { border: 0; min-height: 40px; background: transparent; border-radius: 2rem; padding: .3rem .74rem; font-weight: 400; }
  .languages button[aria-pressed="true"] { background: #e5dec8; font-weight: 650; }
  main.wrap { padding-block: clamp(1.4rem, 4vw, 3.4rem) 3rem; }
  h1, h2 { margin: 0 0 .65rem; font-family: var(--serif); font-weight: 500; line-height: 1.12; letter-spacing: -.04em; }
  h1 { font-size: clamp(2rem, 5vw, 3.1rem); }
  h2 { font-size: clamp(1.4rem, 3.5vw, 1.9rem); }
  .lead, .hero p, .card p { color: var(--muted); }
  .lead { margin: .55rem 0 1.1rem; max-width: 69ch; }
  .hero, .cards, .panel { max-width: 48rem; margin-inline: auto; }
  .hero { padding: .4rem 0 1.4rem; }
  .hero p { margin: 0; max-width: 55ch; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; border-block: 1px solid var(--rule); }
  .card { padding: clamp(1rem, 3vw, 1.7rem); background: #f7efe4; }
  .card + .card { border-left: 1px solid var(--rule); background: #eae3d8; }
  .card p { margin: 0 0 1.1rem; }
  .panel { padding: clamp(1.05rem, 4vw, 2.15rem); background: #fffcf4; border: 1px solid var(--rule); border-radius: .85rem; }
  .progress { margin: 0 0 .45rem; font-weight: 650; color: var(--olive-ink); }
  progress { display: block; width: 100%; height: 7px; margin: 0 0 1.55rem; accent-color: var(--olive); }
  progress::-webkit-progress-bar { background: #ebe3d5; border-radius: 5px; }
  progress::-webkit-progress-value { background: var(--olive); border-radius: 5px; }
  progress::-moz-progress-bar { background: var(--olive); border-radius: 5px; }
  .actions { display: flex; flex-wrap: wrap; gap: .55rem; margin-top: 1.15rem; }
  .stage { margin-top: 1rem; padding: 1rem; border: 1px solid #e5dbcb; border-radius: .65rem; background: #f1e9dd; }
  .stage:empty, .status:empty { display: none; }
  .key-grid { display: flex; flex-wrap: wrap; gap: .45rem; }
  .key { min-width: 2.75rem; padding: .45rem; text-align: center; border: 1px solid var(--rule); border-radius: .38rem; background: #fffcf4; }
  .key.hit { background: #e3e6c8; color: var(--olive-ink); border-color: #9b9d6b; font-weight: 750; }
  .swatch { display: block; width: 100%; height: clamp(9rem, 23vw, 13rem); padding: 0; border-radius: .45rem; touch-action: manipulation; }
  .swatch:fullscreen { height: 100%; border: 0; }
  .preview { display: block; width: min(100%, 24rem); border-radius: .5rem; }
  .pad { display: grid; place-items: center; min-height: 100px; border-style: dashed; }
  .status { color: var(--muted); margin: .7rem 0 0; }
  .nav { border-top: 1px solid var(--rule); padding-top: 1rem; }
  .spec { margin: 1rem 0; }
  .spec input { max-width: 100%; }
  .result { display: flex; justify-content: space-between; gap: .75rem; padding: .7rem 0; border-bottom: 1px solid var(--rule); }
  .result strong { text-align: right; }
  [data-result="good"] { color: var(--olive-ink); }
  [data-result="bad"] { color: var(--rose-ink); }
  .result > div { min-width: 0; overflow-wrap: anywhere; }
  .report-grid { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: .4rem 1rem; margin: 1rem 0; }
  .report-grid dt { font-weight: 650; }
  .report-grid dd { margin: 0; overflow-wrap: anywhere; }
  .history-details { margin: .75rem 0; }
  .history-details summary, .result-help summary, .share-report summary { color: var(--olive-ink); font-weight: 650; }
  .result-help { margin: .35rem 0 .75rem; color: var(--muted); }
  .result-help ol { padding-left: 1.3rem; }
  .troubleshooting { margin-top: 1.2rem; padding: 1rem; border: 1px solid #dfbeb5; border-radius: .65rem; background: #f4e1d9; }
  .troubleshooting[hidden] { display: none; }
  .troubleshooting h2 { margin: 0 0 .55rem; color: var(--rose-ink); }
  .troubleshooting ol { margin: .5rem 0; padding-left: 1.25rem; }
  .troubleshooting li + li { margin-top: .35rem; }
  .seller-panel { margin: 1.25rem 0 1.6rem; }
  .seller-panel label, .share-report label { display: block; font-weight: 650; margin: .65rem 0 .25rem; }
  .seller-panel input, .share-report input { width: 100%; min-width: 0; padding: .55rem .7rem; border: 1px solid var(--input-edge); border-radius: .45rem; background: #fffdf7; color: var(--ink); }
  .claim-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
  .comparison, .share-report { margin-top: 1.2rem; }
  .comparison small { display: block; color: var(--muted); overflow-wrap: anywhere; }
  @media (max-width: 620px) {
    .wrap { width: calc(100% - 2rem); }
    .top .wrap { gap: .45rem; }
    .brand { gap: .36rem; font-size: 1.1rem; }
    .brand-mark { width: 1.3rem; }
    .languages { gap: .06rem; padding: .14rem; }
    .languages button { font-size: .86rem; padding-inline: .48rem; }
    .cards, .claim-fields { grid-template-columns: 1fr; }
    .card + .card { border-left: 0; border-top: 1px solid var(--rule); }
  }
  @media (max-width: 370px) {
    .brand { font-size: 1rem; }
    .languages button { font-size: .8rem; padding-inline: .32rem; }
    .stage { padding: .7rem; }
  }
  @media print {
    body { background: #fff; }
    header, button, input, progress, .download-link, .seller-panel form, .share-report { display: none !important; }
    .panel, .stage { border: 0; background: transparent; padding: 0; }
    main.wrap { width: auto; padding: 0; }
  }
</style>
</head>

  app.innerHTML = `<section class="panel"><p class="progress">${t("step")} ${step+1} / ${checks().length}</p>
    <progress aria-label="${t("step")}" value="${step+1}" max="${checks().length}"></progress>
    <h1 tabindex="-1">${t(check)}</h1><p class="lead">${t(check === "specs" ? (localChecker ? "localSpecDesc" : "specDesc") : check+"Hint")}</p>
    <div class="stage" id="stage"></div><p class="status" id="status" role="status"></p>
    <div class="actions">${check === "specs" ? button("next","next",true)+button("bad","bad") :
      button("good","good",true)+button("bad","bad")+button("skip","skip")}</div>
    <section class="troubleshooting" id="troubleshooting" aria-labelledby="trouble-title"${troubleshooting ? "" : " hidden"}>
      <h2 id="trouble-title" tabindex="-1">${t("helpTitle")}</h2>${tipList(check)}
      <div class="actions">${button("retry-check","retryCheck",true)}${button("record-issue","recordIssue")}</div>
    </section>
    <div class="actions nav">${button("back",step ? "back" : "home")}</div></section>`;
  const help = document.getElementById("troubleshooting");
  const problemButton = document.getElementById("bad");
  function setHelp(open) {
    troubleshooting = open;
    help.hidden = !open;
    problemButton.setAttribute("aria-expanded",String(open));
  }
  function continueToNext(result) {
    results[check] = result;
    troubleshooting = false;
    step++;
    render();
  }
  problemButton.setAttribute("aria-controls","troubleshooting");
  setHelp(troubleshooting);
  on("bad", () => {
    setHelp(true);
    document.getElementById("trouble-title").focus();
  });
  on("record-issue", () => continueToNext("bad"));
  on("retry-check", () => {
    setHelp(false);
    if (check !== "specs") {
      render();
      return;
    }
    const retry = document.getElementById(localChecker ? "retryScan" : "file");
    retry.focus();
    if (localChecker) retry.click();
  });
  on("back", () => {
    troubleshooting = false;
    if (step) step--;
    else if (browserQuick) { location.href = landing(); return; }
    else mode = null;
    render();
  });
  if (check === "specs") on("next", () => continueToNext(report ? "good" : "skip"));
  else for (const result of ["good","skip"]) {
    on(result, () => continueToNext(result));
  }
  const stage = document.getElementById("stage");
  const status = message => { document.getElementById("status").textContent = message; };
  if (check === "specs") setupReport(stage,status,() => setHelp(true));
  if (check === "display") setupDisplay(stage);
  if (check === "keyboard") setupKeyboard(stage,status);
  if (check === "sound" || check === "headphone") setupSound(stage,status,() => setHelp(true));
  if (check === "pad") {
    stage.innerHTML = `<button id="tap" class="pad">${t("tap")}</button>`;
    on("tap", () => status(t("tapped")));
  }
  if (["camera","mic"].includes(check)) setupMedia(check,stage,status,() => setHelp(true));
}
function reportHtml() {
  if (!report) return "";
  const {diskHours, installDate, oldestBoot, details, ...specs} = report;
  const row = ([key,value]) => {
    const display = value?.label ? t(value.label) : value;
    return `<dt>${t(key)}</dt><dd>${escapeHtml(display ?? t("unseen"))}</dd>`;
  };
  const specRows = `<dl class="report-grid">${Object.entries(specs).map(row).join("")}</dl>`;
  if (diskHours === undefined) return specRows;
  const formattedHours = diskHours === null ? t("hoursUnavailable") :
    `${new Intl.NumberFormat(lang).format(diskHours)} ${t("hours")}`;
  const extras = details ? `<details class="history-details"${mode === "full" ? " open" : ""}><summary>${t("detailTitle")}</summary>
    <dl class="report-grid">${Object.entries(details).map(row).join("")}</dl></details>` : "";
  return `${specRows}${extras}<details class="history-details"><summary>${t("historyTitle")}</summary>
    <dl class="report-grid">${row(["diskHours",formattedHours])}</dl><p class="lead">${t("hoursHint")}</p>
    <dl class="report-grid">${Object.entries({installDate,oldestBoot}).map(row).join("")}</dl><p class="lead">${t("historyHint")}</p></details>`;
}
function readReport(data, fromWindows = false) {
  const validNumber = value => Number.isFinite(value) && value > 0;
  const validText = value => typeof value === "string" && value.trim();
  if (data?.version !== 1) throw new Error("Unsupported report version");
  const ram = validNumber(data.ramGiB) ? data.ramGiB+" GB" : null;
  const cpu = validText(data.processor) ? data.processor.trim().slice(0,160) : null;
  const disk = validNumber(data.storageGB) ? data.storageGB+" GB" : null;
  if (fromWindows ? !(ram || cpu || disk) : !ram) throw new Error("Incomplete report");
  const fields = {};
  if (validText(data.model)) fields.model = data.model.trim().slice(0,160);
  fields.ram = ram;
  fields.cpu = cpu;
  fields[fromWindows && data.storageScope === "windowsDisk" ? "windowsStorage" : "storage"] = disk;
  if (fromWindows) {
    fields.graphics = validText(data.graphics) ? data.graphics.trim().slice(0,240) : null;
    fields.windowsEdition = validText(data.windowsEdition) ? data.windowsEdition.trim().slice(0,120) : null;
    if (validText(data.windowsBuild)) fields.windowsBuild = data.windowsBuild.trim().slice(0,24);
    const charge = data.batteryChargePercent;
    fields.batteryCharge = Number.isFinite(charge) && charge >= 0 && charge <= 100 ? charge+"%" : null;
    fields.batteryCapacity = validNumber(data.batteryCapacityPercent) ? data.batteryCapacityPercent+"%" : null;
    fields.diskHours = Number.isInteger(data.diskPowerOnHours) && data.diskPowerOnHours >= 0 ? data.diskPowerOnHours : null;
    fields.installDate = /^\d{4}-\d{2}-\d{2}$/.test(data.windowsInstallDate) ? data.windowsInstallDate : null;
    fields.oldestBoot = /^\d{4}-\d{2}-\d{2}$/.test(data.oldestRecordedBootDate) ? data.oldestRecordedBootDate : null;
    const counter = value => Number.isSafeInteger(value) && value >= 0 ? value : null;
    const withUnit = (value, unit) => Number.isFinite(value) && value >= 0 ? value+" "+unit : null;
    fields.details = {
      cpuCores: validNumber(data.cpuCores) ? data.cpuCores : null,
      cpuThreads: validNumber(data.cpuThreads) ? data.cpuThreads : null,
      ramSpeed: Array.isArray(data.ramSpeeds) && data.ramSpeeds.some(validNumber) ?
        data.ramSpeeds.filter(validNumber).join(" / ")+" MHz" : null,
      displayMode: Array.isArray(data.displayModes) && data.displayModes.some(validText) ?
        data.displayModes.filter(validText).join(" / ").slice(0,160) : null,
      driveModel: validText(data.diskModel) ? data.diskModel.trim().slice(0,160) : null,
      driveBus: validText(data.diskBusType) ? data.diskBusType.trim().slice(0,32) : null,
      freeSpace: withUnit(data.systemVolumeFreeGB,"GB"),
      batteryCycles: counter(data.batteryCycles),
      batteryDesign: withUnit(data.batteryDesignMWh,"mWh"),
      batteryFull: withUnit(data.batteryFullMWh,"mWh"),
      diskTemp: Number.isFinite(data.diskTemperatureC) ? data.diskTemperatureC+" °C" : null,
      diskCycles: counter(data.diskPowerCycles),
      diskWear: withUnit(data.diskEnduranceUsedPercent,"%"),
      diskErrors: counter(data.diskMediaErrors),
      diskWarning: typeof data.diskCriticalWarning === "boolean" ? {label:data.diskCriticalWarning ? "diskWarningYes" : "diskWarningNo"} : null
    };
  }
  return fields;
}
function setupReport(stage,status,onFailure) {
  if (localChecker) {
    stage.innerHTML = `<div id="imported">${reportHtml()}</div>${button("retryScan","retryScan")}`;
    let controller;
    cleanup = () => controller?.abort();
    async function scan() {
      controller = new AbortController();
      const retry = stage.querySelector("#retryScan");
      retry.disabled = true;
      status(t("scanning"));
      try {
        const response = await fetch("/api/specs", {signal: controller.signal});
        if (!response.ok) throw new Error("Scan failed");
        const data = await response.json();
        if (!stage.isConnected) return;
        report = readReport(data, true);
        stage.querySelector("#imported").innerHTML = reportHtml();
        status(t("scanned"));
      } catch {
        if (stage.isConnected) { status(t("scanFailed")); onFailure(); }
      } finally {
        if (stage.isConnected) retry.disabled = false;
      }
    }
    on("retryScan", scan);
    if (!report) scan();
    return;
  }
  stage.innerHTML = `<label for="file"><strong>${t("open")}</strong></label><div class="spec"><input id="file" type="file" accept=".json,application/json"></div><div id="imported">${reportHtml()}</div>`;
  const fileInput = document.getElementById("file");
  fileInput.addEventListener("change", async () => {
    const file = fileInput.files[0];
    if (!file) return;
    try {
      if (file.size > 64000) throw new Error();
      const data = JSON.parse(await file.text());
      if (!stage.isConnected || fileInput.files[0] !== file) return;
      report = readReport(data);
      stage.querySelector("#imported").innerHTML = reportHtml();
      status(t("loaded"));
    } catch {
      if (!stage.isConnected || fileInput.files[0] !== file) return;
      report = null;
      stage.querySelector("#imported").replaceChildren();
      status(t("invalid"));
      onFailure();
    }
  });
}
function setupDisplay(stage) {
  const colors = ["#ffffff","#111111","#ee1717","#0bbd53","#204efa"];
  let index = 0;
  stage.innerHTML = `<button id="swatch" class="swatch" aria-label="${t("color")}"></button><div class="actions">${button("color","color")}${button("expand","expand")}</div>`;
  const swatch = document.getElementById("swatch");
  function paint() { swatch.style.backgroundColor = colors[index]; }
  function advance() { index = (index+1) % (mode === "quick" ? 2 : colors.length); paint(); }
  paint();
  on("color",advance);
  on("swatch",advance);
  if (swatch.requestFullscreen) on("expand", () => swatch.requestFullscreen().catch(() => {}));
  else document.getElementById("expand").hidden = true;
}
function setupKeyboard(stage,status) {
  const keys = mode === "quick" ? ["Q","A","Z","J","P","Space","Enter"] : [..."QWERTYUIOPASDFGHJKLZXCVBNM1234567890","Space","Enter","Backspace","ArrowUp","ArrowLeft","ArrowDown","ArrowRight"];
  const names = {Space:"␣",ArrowUp:"↑",ArrowLeft:"←",ArrowDown:"↓",ArrowRight:"→"};
  stage.innerHTML = `<div tabindex="0" aria-label="${t("keyArea")}" class="key-grid">${keys.map(key => `<span class="key" data-key="${key}">${names[key] || key}</span>`).join("")}</div>`;
  const hit = new Set();
  stage.firstElementChild.addEventListener("keydown", event => {
    const key = event.code.replace(/^(Key|Digit)/,"");
    if (!keys.includes(key)) return;
    event.preventDefault();
    hit.add(key);
    stage.querySelector(`[data-key="${key}"]`).classList.add("hit");
    status(`${t("seen")}: ${hit.size} / ${keys.length}`);
  });
}
function setupSound(stage,status,onFailure) {
  stage.innerHTML = button("play","play");
  let context;
  cleanup = () => { if (context && context.state !== "closed") context.close().catch(() => {}); };
  on("play", async () => {
    try {
      context ||= new AudioContext();
      await context.resume();
      if (!stage.isConnected) return;
      const tone = context.createOscillator();
      const volume = context.createGain();
      tone.frequency.value = 440;
      volume.gain.value = 0.12;
      volume.gain.exponentialRampToValueAtTime(0.001,context.currentTime+0.55);
      tone.connect(volume).connect(context.destination);
      tone.start();
      tone.stop(context.currentTime+0.6);
    } catch { if (stage.isConnected) { status(t("blocked")); onFailure(); } }
  });
}
function setupMedia(check,stage,status,onFailure) {
  stage.innerHTML = button("enable","enable");
  let stream, context, animation;
  cleanup = () => {
    stream?.getTracks().forEach(track => track.stop());
    if (context) context.close().catch(() => {});
    cancelAnimationFrame(animation);
  };
  on("enable", async () => {
    const enable = document.getElementById("enable");
    enable.disabled = true;
    status(t("waiting"));
    try {
      stream = await navigator.mediaDevices.getUserMedia(check === "camera" ? {video:true} : {audio:true});
      if (!stage.isConnected) { stream.getTracks().forEach(track => track.stop()); return; }
      status("");
      if (check === "camera") {
        const video = document.createElement("video");
        video.className = "preview";
        video.autoplay = video.playsInline = video.muted = true;
        video.srcObject = stream;
        stage.replaceChildren(video);
      } else {
        context = new AudioContext();
        await context.resume();
        if (!stage.isConnected) return;
        const analyser = context.createAnalyser();
        context.createMediaStreamSource(stream).connect(analyser);
        const samples = new Uint8Array(analyser.fftSize);
        const meter = document.createElement("meter");
        meter.max = 1;
        meter.setAttribute("aria-label",t("mic"));
        stage.replaceChildren(meter);
        let heard = false;
        function update() {
          analyser.getByteTimeDomainData(samples);
          const peak = samples.reduce((max, sample) => Math.max(max, Math.abs(sample-128)),0);
          meter.value = peak/128;
          if (peak > 8 && !heard) { heard = true; status(t("detected")); }
          animation = requestAnimationFrame(update);
        }
        update();
      }
    } catch {
      stream?.getTracks().forEach(track => track.stop());
      if (stage.isConnected) { enable.disabled = false; status(t("blocked")); onFailure(); }
    }
  });
}
const claimFields = {
  ramGB: ["ram","ram",true],
  storageGB: ["storage","windowsStorage",true],
  processor: ["cpu","cpu",false],
  graphics: ["graphics","graphics",false],
  model: ["model","model",false]
};

function compareClaim(key, claimed, observed) {
  if (!observed) return "review";
  if (key === "ramGB") return Number(claimed) === parseFloat(observed) ? "match" : "mismatch";
  if (key === "storageGB") {
    // Advertised drive capacity is nominal and can differ slightly from Windows.
    const difference = Math.abs(Number(claimed)-parseFloat(observed));
    if (difference < 0.5) return "match";
    return difference / Number(claimed) <= 0.05 ? "closeSize" : "mismatch";
  }
  const normalize = value => value.toLowerCase().replace(/[^\p{L}\p{N}]+/gu," ").trim();
  const expected = normalize(claimed);
  const actual = normalize(observed);
  if (expected && ` ${actual} `.includes(` ${expected} `)) return "match";
  if (key === "processor") {
    const intelModel = value => value.match(/\bi[3579] \d{4,5}[a-z]*\b/)?.[0];
    const fullExpected = intelModel(expected);
    const fullActual = intelModel(actual);
    if (fullExpected && fullActual && fullExpected !== fullActual) return "mismatch";
    const intelTier = value => value.match(/\bi[3579]\b/)?.[0];
    const expectedTier = intelTier(expected);
    const actualTier = intelTier(actual);
    if (expectedTier && actualTier && expectedTier !== actualTier) return "mismatch";
  }
  // A shorthand model name or an incomplete driver name needs a human check.
  return "review";
}

function setupSellerComparison() {
  const form = document.getElementById("seller-form");
  const comparison = document.getElementById("comparison");
  function showComparison() {
    const rows = Object.entries(claimFields).flatMap(([key,[label,field,numeric]]) => {
      const claimed = seller.claims[key];
      if (!claimed || (numeric && (!Number.isFinite(Number(claimed)) || Number(claimed) <= 0))) return [];
      const observed = report?.[field] ?? (key === "storageGB" ? report?.storage : null);
      const result = compareClaim(key,claimed,observed);
      const tone = result === "match" ? "good" : result === "mismatch" ? "bad" : "";
      return `<div class="result" data-result="${tone}"><div>${t(label)}<small>${t("sellerValue")} — ${escapeHtml(claimed)}${numeric ? " GB" : ""}</small><small>${t("scannedValue")} — ${escapeHtml(observed ?? t("unseen"))}</small></div><strong>${t(result)}</strong></div>`;
    });
    comparison.innerHTML = rows.length ? rows.join("") : `<p>${t("noClaims")}</p>`;
  }
  if (seller.compared) showComparison();
  form.addEventListener("input", event => {
    if (!Object.hasOwn(claimFields,event.target.name)) return;
    seller.claims[event.target.name] = event.target.value.trim();
    seller.compared = false;
    comparison.replaceChildren();
  });
  form.addEventListener("submit", event => {
    event.preventDefault();
    seller.compared = true;
    showComparison();
  });
}

function inspectionResults(keys, readings = results) {
  return keys.map(key => {
    const result = readings[key] || "unseen";
    return `<div class="result"><span>${t(key)}</span><strong data-result="${result}">${t(result)}</strong></div>${result === "bad" ?
      `<details class="result-help"><summary>${t("helpForResult")}</summary>${tipList(key)}</details>` : ""}`;
  }).join("");
}

async function reportRequest(path, data) {
  const response = await fetch(path, {
    method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data)
  });
  if (!response.ok) throw new Error("Report request failed");
  return response.json();
}

function setupShareReport() {
  const panel = document.getElementById("share-report");
  const notice = document.getElementById("share-status");
  const linkForm = document.getElementById("share-link-form");
  const input = document.getElementById("share-link");
  function showLink() {
    if (!shareLink) return;
    panel.open = true;
    linkForm.hidden = false;
    input.value = shareLink;
  }
  showLink();
  on("create-report-link", async () => {
    const create = document.getElementById("create-report-link");
    create.disabled = true;
    notice.textContent = "";
    try {
      const {token} = await reportRequest("/api/reports",{results});
      if (!panel.isConnected) return;
      const url = new URL("./browser-check.html",location.href);
      url.search = `?report=1&lang=${lang}`;
      url.hash = token;
      shareLink = url.href;
      showLink();
      input.focus();
      input.select();
    } catch {
      if (panel.isConnected) notice.textContent = t("shareError");
    } finally {
      create.disabled = false;
    }
  });
  on("copy-report-link", async () => {
    try {
      await navigator.clipboard.writeText(input.value);
      notice.textContent = t("copied");
    } catch {
      input.focus();
      input.select();
    }
  });
}

function renderSharedReport() {
  const content = sharedResults ?
    inspectionResults(browserFullChecks.filter(key => Object.hasOwn(sharedResults,key)),sharedResults) :
    `<p role="status">${t(sharedResults === undefined ? "sharedLoading" : "sharedMissing")}</p>`;
  app.innerHTML = `<section class="panel"><h1 tabindex="-1">${t("sharedTitle")}</h1>${content}
    <div class="actions"><a class="download-link" href="${landing()}">${t("home")}</a></div></section>`;
}

async function loadSharedReport() {
  const token = location.hash.slice(1);
  try {
    const report = await reportRequest("/api/reports/view",{token});
    sharedResults = report.results;
  } catch {
    sharedResults = null;
  }
  render(false);
}

function renderSummary() {
  if (browserQuick) {
    app.innerHTML = `<section class="panel"><h1 tabindex="-1">${t(mode === "quick" ? "browserSummary" : "summary")}</h1>
      ${inspectionResults(checks())}
      <p class="lead">${t("browserLimits")}</p>
      <div class="actions">${mode === "quick" ? button("browser-extra","moreBrowser",true) : ""}
      <a class="download-link" href="${landing()}#download">${t("downloadChecker")}</a>${button("restart","restart")}</div>
      ${reportBackend ? `<details class="share-report" id="share-report"><summary>${t("share")}</summary>
        <p>${t("shareConsent")}</p>${button("create-report-link","createLink")}
        <div class="spec" id="share-link-form" hidden><label for="share-link">${t("reportLink")}</label>
          <input id="share-link" type="url" readonly><div class="actions">${button("copy-report-link","copyLink")}</div></div>
        <p class="status" id="share-status" role="status"></p></details>` : ""}</section>`;
    if (mode === "quick") on("browser-extra", () => {
      mode = "full";
      step = browserChecks.length;
      shareLink = "";
      render();
    });
    on("restart", () => start("quick"));
    if (reportBackend) setupShareReport();
    return;
  }
  app.innerHTML = `<section class="panel"><h1 tabindex="-1">${t("summary")}</h1><p class="lead">${t("summaryHint")}</p>
    <section class="stage seller-panel" aria-labelledby="seller-title">
    <h2 id="seller-title">${t("sellerTitle")}</h2><p>${t("sellerHint")}</p>
    <form id="seller-form"><div class="claim-fields">${Object.entries(claimFields).map(([key,[label,,numeric]]) =>
      `<div><label for="claim-${key}">${t(label)}${numeric ? " (GB)" : ""}</label><input id="claim-${key}" name="${key}" ${numeric ? 'type="number" min="0.01" step="any" inputmode="decimal"' : 'maxlength="160"'} value="${escapeHtml(seller.claims[key] ?? "")}"></div>`
    ).join("")}</div><div class="actions"><button class="primary" type="submit">${t("compare")}</button></div></form>
    <div class="comparison" id="comparison" aria-live="polite"></div></section>
    <h2>${t("specs")}</h2>${report ? reportHtml() : `<p>${t("unseen")}</p>`}
    ${inspectionResults(results.specs === "bad" ? checks() : checks().slice(1))}
    <div class="actions">${mode === "quick" ? button("extra","extra",true) : ""}${button("print","print")}${button("restart","restart")}</div></section>`;
  if (mode === "quick") on("extra", () => { mode = "full"; step = quickChecks.length; render(); });
  setupSellerComparison();
  on("print", () => window.print());
  on("restart", () => { mode = null; results = {}; report = null; render(); });
}
for (const code of ["ky","ru"]) on(code, () => { if (lang !== code) { lang = code; render(false); } });
render(false);
if (sharedView) loadSharedReport();
</script>
